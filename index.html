<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0c1a28" />
  <title>雪景</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --night: #0a1622;
      --night-2: #122536;
      --mist: #7f9bb0;
      --frost: #d7ebf7;
      --ice: #9fc4dc;
      --line: rgba(180, 214, 235, 0.22);
      --panel: rgba(8, 20, 32, 0.78);
      --danger: #e8919a;
      --ok: #b7d7ea;
      --safe-top: max(12px, env(safe-area-inset-top));
      --safe-bot: max(14px, env(safe-area-inset-bottom));
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      color: var(--frost);
      font-family: "Manrope", "PingFang SC", sans-serif;
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
      background:
        radial-gradient(900px 520px at 18% -8%, rgba(120, 168, 204, 0.28), transparent 58%),
        radial-gradient(700px 480px at 92% 8%, rgba(64, 110, 148, 0.22), transparent 52%),
        linear-gradient(168deg, #07131d 0%, var(--night-2) 46%, #0b1824 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: 0.35;
      background-image:
        radial-gradient(1.2px 1.2px at 12% 18%, rgba(255,255,255,.55), transparent),
        radial-gradient(1px 1px at 28% 42%, rgba(255,255,255,.4), transparent),
        radial-gradient(1.4px 1.4px at 61% 14%, rgba(255,255,255,.5), transparent),
        radial-gradient(1px 1px at 78% 36%, rgba(255,255,255,.35), transparent),
        radial-gradient(1.2px 1.2px at 88% 72%, rgba(255,255,255,.45), transparent),
        radial-gradient(1px 1px at 42% 78%, rgba(255,255,255,.3), transparent);
      animation: starDrift 18s linear infinite;
    }

    .app {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      max-width: 920px;
      margin: 0 auto;
    }

    .top {
      flex-shrink: 0;
      padding: var(--safe-top) 18px 10px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      animation: riseIn 0.7s ease both;
    }

    .brand-block { min-width: 0; }

    .brand {
      margin: 0;
      font-family: "Fraunces", "Songti SC", serif;
      font-weight: 650;
      font-size: clamp(2rem, 7vw, 2.75rem);
      letter-spacing: 0.22em;
      line-height: 1;
      color: #f3f8fc;
    }

    .brand span {
      display: inline-block;
      animation: softBob 4.8s ease-in-out infinite;
    }

    .tag {
      margin: 8px 0 0;
      color: var(--mist);
      font-size: 0.82rem;
      font-weight: 500;
      letter-spacing: 0.04em;
    }

    .help-link {
      flex-shrink: 0;
      border: 0;
      background: transparent;
      color: var(--ice);
      font: inherit;
      font-size: 0.78rem;
      letter-spacing: 0.06em;
      padding: 0.4rem 0;
      opacity: 0.85;
    }

    .stage-wrap {
      flex: 1;
      min-height: 0;
      padding: 6px 14px 0;
      display: flex;
      animation: riseIn 0.85s ease 0.08s both;
    }

    .stage {
      position: relative;
      flex: 1;
      min-height: 0;
      overflow: hidden;
      touch-action: none;
      background:
        linear-gradient(180deg, rgba(18, 40, 58, 0.55), rgba(8, 16, 26, 0.2)),
        radial-gradient(120% 80% at 50% 100%, rgba(150, 190, 220, 0.12), transparent 55%),
        #08121c;
      border: 1px solid var(--line);
      box-shadow: 0 28px 60px rgba(0, 0, 0, 0.35);
    }

    .stage::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 4;
      box-shadow: inset 0 0 80px rgba(0, 0, 0, 0.28);
    }

    #view {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }

    .placeholder {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: grid;
      place-content: center;
      gap: 8px;
      text-align: center;
      padding: 28px 22px;
      background:
        linear-gradient(180deg, rgba(10, 24, 38, 0.25), rgba(8, 16, 26, 0.55)),
        radial-gradient(ellipse 90% 55% at 50% 110%, rgba(170, 205, 230, 0.16), transparent 60%);
    }

    .placeholder[hidden] { display: none !important; }

    .placeholder .mark {
      width: 10px;
      height: 10px;
      margin: 0 auto 10px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fff, rgba(200, 230, 255, 0.8) 45%, transparent 70%);
      animation: softBob 3.6s ease-in-out infinite;
    }

    .placeholder .t {
      margin: 0;
      font-family: "Fraunces", "Songti SC", serif;
      font-size: clamp(1.2rem, 4.5vw, 1.55rem);
      font-weight: 500;
      letter-spacing: 0.12em;
      color: #f4f8fb;
    }

    .placeholder .s {
      margin: 0 0 18px;
      color: var(--mist);
      font-size: 0.9rem;
      font-weight: 400;
      letter-spacing: 0.02em;
    }

    .pick {
      justify-self: center;
      padding: 0.85rem 1.5rem;
      border: 1px solid rgba(200, 230, 255, 0.4);
      background: linear-gradient(180deg, rgba(190, 220, 240, 0.18), rgba(140, 180, 210, 0.08));
      color: #f5faff;
      font: inherit;
      font-size: 0.92rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .pick:active { transform: scale(0.98); }

    .bar {
      flex-shrink: 0;
      margin-top: 12px;
      padding: 14px 14px var(--safe-bot);
      display: grid;
      gap: 12px;
      background:
        linear-gradient(180deg, rgba(14, 28, 42, 0.55), var(--panel));
      border-top: 1px solid var(--line);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      animation: riseIn 0.9s ease 0.14s both;
    }

    .row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .btn {
      appearance: none;
      border: 1px solid var(--line);
      background: rgba(160, 200, 225, 0.07);
      color: var(--frost);
      font: inherit;
      font-size: 0.8rem;
      font-weight: 500;
      padding: 0.78rem 0.35rem;
      letter-spacing: 0.06em;
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
    }

    .btn:active {
      transform: translateY(1px);
      background: rgba(160, 200, 225, 0.16);
    }

    .btn.primary {
      background: linear-gradient(180deg, rgba(210, 232, 245, 0.28), rgba(150, 190, 220, 0.14));
      border-color: rgba(210, 235, 250, 0.45);
      color: #fff;
      font-weight: 600;
    }

    .btn.danger {
      border-color: rgba(232, 145, 154, 0.55);
      color: var(--danger);
      background: rgba(232, 145, 154, 0.08);
    }

    .sliders {
      display: grid;
      gap: 10px;
    }

    .slider {
      display: grid;
      grid-template-columns: 42px 1fr 34px;
      align-items: center;
      gap: 10px;
      font-size: 0.76rem;
      color: var(--mist);
      letter-spacing: 0.04em;
    }

    .slider output {
      text-align: right;
      color: var(--ok);
      font-variant-numeric: tabular-nums;
      font-weight: 600;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, rgba(150, 190, 220, 0.15), rgba(190, 220, 240, 0.4));
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: #eef6fb;
      border: 1px solid rgba(180, 210, 230, 0.65);
      box-shadow: 0 0 0 4px rgba(160, 200, 230, 0.12);
    }

    .status {
      min-height: 1.15em;
      font-size: 0.76rem;
      color: var(--mist);
      text-align: center;
      letter-spacing: 0.02em;
    }

    .status.rec {
      color: var(--danger);
      animation: pulseText 1.2s ease-in-out infinite;
    }

    body.is-present {
      background: #000;
    }

    body.is-present::before,
    body.is-present .top,
    body.is-present .bar,
    body.is-present .sheet,
    body.is-present .present-exit {
      display: none !important;
    }

    body.is-present .app {
      max-width: none;
    }

    body.is-present .stage-wrap {
      padding: 0;
    }

    body.is-present .stage {
      border: 0;
      box-shadow: none;
      background: #000;
    }

    body.is-present .stage::after {
      display: none;
    }


    #fileInput { display: none; }

    .sheet {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 30;
      background: rgba(4, 10, 16, 0.62);
      padding: 24px 16px var(--safe-bot);
      align-items: end;
      justify-content: center;
      backdrop-filter: blur(6px);
    }

    .sheet.show { display: flex; }

    .sheet-card {
      width: min(440px, 100%);
      background:
        radial-gradient(80% 60% at 20% 0%, rgba(140, 180, 210, 0.16), transparent 55%),
        linear-gradient(180deg, #15293a, #101f2c);
      border: 1px solid var(--line);
      padding: 22px 18px 16px;
      animation: sheetUp 0.35s ease both;
    }

    .sheet-card h2 {
      margin: 0 0 12px;
      font-family: "Fraunces", "Songti SC", serif;
      font-size: 1.25rem;
      font-weight: 650;
      letter-spacing: 0.12em;
    }

    .sheet-card ol {
      margin: 0 0 16px;
      padding-left: 1.15em;
      color: var(--mist);
      font-size: 0.88rem;
      line-height: 1.65;
    }

    .sheet-card .btn { width: 100%; padding: 0.85rem; }

    @keyframes riseIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes softBob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(3px); }
    }

    @keyframes starDrift {
      from { transform: translateY(0); }
      to { transform: translateY(18px); }
    }

    @keyframes pulseText {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.55; }
    }

    @keyframes sheetUp {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (min-width: 780px) {
      .app { padding-top: 8px; }
      .stage-wrap { padding: 8px 20px 0; }
      .bar {
        margin: 14px 20px var(--safe-bot);
        border: 1px solid var(--line);
        border-top: 1px solid var(--line);
      }
      .top { padding-left: 20px; padding-right: 20px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand-block">
        <h1 class="brand"><span>雪</span>景</h1>
        <p class="tag">把落雪铺在你的画面上</p>
      </div>
      <button class="help-link" type="button" id="openHelp">用法</button>
    </header>

    <div class="stage-wrap">
      <div class="stage" id="stage">
        <canvas id="view"></canvas>
        <div class="placeholder" id="placeholder">
          <div class="mark" aria-hidden="true"></div>
          <p class="t">放一张照片</p>
          <p class="s">雪会在上层轻轻落下</p>
          <button class="pick" type="button" id="pickBtn">从相册选择</button>
        </div>
      </div>
    </div>

    <div class="bar">
      <div class="row">
        <button class="btn" type="button" id="uploadBtn">换图</button>
        <button class="btn" type="button" id="pauseBtn">暂停</button>
        <button class="btn" type="button" id="presentBtn">全屏</button>
        <button class="btn primary" type="button" id="recordBtn">录制</button>
      </div>
      <div class="sliders">
        <label class="slider">雪量 <input id="count" type="range" min="40" max="360" value="180" /><output id="countOut">180</output></label>
        <label class="slider">速度 <input id="speed" type="range" min="0.3" max="2.2" step="0.1" value="0.85" /><output id="speedOut">0.9</output></label>
        <label class="slider">风向 <input id="wind" type="range" min="-2" max="2" step="0.1" value="0.25" /><output id="windOut">0.3</output></label>
        <label class="slider">大小 <input id="size" type="range" min="0.5" max="2" step="0.1" value="1" /><output id="sizeOut">1.0</output></label>
      </div>
      <div class="status" id="status">录制约 6 秒，完成后可保存到相册</div>
    </div>
  </div>

  <input id="fileInput" type="file" accept="image/*,video/*" />

  <div class="sheet" id="helpSheet">
    <div class="sheet-card">
      <h2>怎么用</h2>
      <ol>
        <li>点「换图」从相册选照片或视频</li>
        <li>拖动滑条调节雪量、速度与风向</li>
        <li>点「录制」导出约 6 秒成片</li>
        <li>若 iPhone 录制失败：点「全屏」，再用系统屏幕录制</li>
      </ol>
      <button class="btn primary" type="button" id="closeHelp">开始</button>
    </div>
  </div>

  <script>
  (() => {
    const view = document.getElementById("view");
    const ctx = view.getContext("2d", { alpha: false });
    const stage = document.getElementById("stage");
    const placeholder = document.getElementById("placeholder");
    const fileInput = document.getElementById("fileInput");
    const statusEl = document.getElementById("status");
    const helpSheet = document.getElementById("helpSheet");

    const countInput = document.getElementById("count");
    const speedInput = document.getElementById("speed");
    const windInput = document.getElementById("wind");
    const sizeInput = document.getElementById("size");

    const mediaImg = new Image();
    const mediaVideo = document.createElement("video");
    mediaVideo.playsInline = true;
    mediaVideo.muted = true;
    mediaVideo.loop = true;
    mediaVideo.setAttribute("playsinline", "");
    mediaVideo.setAttribute("webkit-playsinline", "");

    let mediaType = null;
    let objectUrl = null;
    let flakes = [];
    let w = 0, h = 0, dpr = 1;
    let running = true;
    let recording = false;
    let recorder = null;
    let chunks = [];
    let recordTimer = null;

    function rand(a, b) { return a + Math.random() * (b - a); }

    function pickLayer() {
      const t = Math.random();
      if (t < 0.58) return rand(0.05, 0.32);
      if (t < 0.88) return rand(0.32, 0.68);
      return rand(0.68, 1);
    }

    function createFlake(fromTop) {
      const layer = pickLayer();
      const sizeScale = Number(sizeInput.value);
      const kind = Math.random() < 0.012 ? "crystal" : "dot";
      const r = kind === "crystal"
        ? rand(3.2, 7.5 + layer * 5) * sizeScale
        : rand(0.8 + layer * 0.5, 1.6 + layer * 4.2) * sizeScale;
      const fall = rand(0.28 + layer * 0.7, 0.45 + layer * 1.15);
      return {
        x: rand(-20, (w || 1) + 20),
        y: fromTop ? rand(-50, -6) : rand(0, h || 1),
        r,
        kind,
        layer,
        vy: fall,
        vx: rand(-0.18, 0.18),
        rot: rand(0, Math.PI * 2),
        spin: rand(-0.02, 0.02) * (0.4 + layer),
        wobble: rand(0, Math.PI * 2),
        wobbleSpeed: rand(0.008, 0.03),
        wobbleAmp: rand(0.12, 0.42) * (0.5 + layer),
        opacity: Math.min(0.95, 0.5 + (1 - layer) * 0.35 + layer * 0.2),
        soft: kind === "dot" && (layer > 0.55 || Math.random() < 0.3),
        arms: 6,
      };
    }

    function rebuild() {
      const n = Number(countInput.value);
      flakes = Array.from({ length: n }, () => createFlake(false));
    }

    function resize() {
      const rect = stage.getBoundingClientRect();
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = Math.max(1, Math.floor(rect.width));
      h = Math.max(1, Math.floor(rect.height));
      view.width = Math.floor(w * dpr);
      view.height = Math.floor(h * dpr);
      view.style.width = w + "px";
      view.style.height = h + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      rebuild();
    }

    function drawCover(source, sw, sh) {
      if (!sw || !sh) return;
      const scale = Math.max(w / sw, h / sh);
      const dw = sw * scale;
      const dh = sh * scale;
      const dx = (w - dw) / 2;
      const dy = (h - dh) / 2;
      ctx.drawImage(source, dx, dy, dw, dh);
    }

    function drawMedia() {
      ctx.fillStyle = "#08121c";
      ctx.fillRect(0, 0, w, h);
      if (mediaType === "image" && mediaImg.complete && mediaImg.naturalWidth) {
        drawCover(mediaImg, mediaImg.naturalWidth, mediaImg.naturalHeight);
      } else if (mediaType === "video" && mediaVideo.readyState >= 2) {
        drawCover(mediaVideo, mediaVideo.videoWidth, mediaVideo.videoHeight);
      }
    }

    function drawDot(f) {
      if (f.soft) {
        const glow = f.r * (1.8 + f.layer * 0.7);
        const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, glow);
        g.addColorStop(0, `rgba(255,255,255,${f.opacity})`);
        g.addColorStop(0.4, `rgba(255,255,255,${f.opacity * 0.5})`);
        g.addColorStop(1, "rgba(255,255,255,0)");
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(f.x, f.y, glow, 0, Math.PI * 2);
        ctx.fill();
      } else {
        const edge = Math.max(f.r * 1.4, f.r + 0.7);
        const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, edge);
        g.addColorStop(0, `rgba(255,255,255,${f.opacity})`);
        g.addColorStop(0.55, `rgba(255,255,255,${f.opacity * 0.85})`);
        g.addColorStop(1, "rgba(255,255,255,0)");
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(f.x, f.y, edge, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawCrystal(f) {
      ctx.save();
      ctx.translate(f.x, f.y);
      ctx.rotate(f.rot);
      ctx.globalAlpha = f.opacity;
      ctx.strokeStyle = "rgba(255,255,255,0.95)";
      ctx.fillStyle = "rgba(255,255,255,0.95)";
      ctx.lineWidth = Math.max(0.7, f.r * 0.08);
      ctx.lineCap = "round";

      const arm = f.r;
      for (let i = 0; i < f.arms; i++) {
        ctx.save();
        ctx.rotate((Math.PI * 2 * i) / f.arms);
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(0, -arm);
        ctx.stroke();
        const b1 = arm * 0.42;
        const b2 = arm * 0.68;
        ctx.beginPath();
        ctx.moveTo(0, -b1);
        ctx.lineTo(-arm * 0.22, -b1 - arm * 0.16);
        ctx.moveTo(0, -b1);
        ctx.lineTo(arm * 0.22, -b1 - arm * 0.16);
        ctx.moveTo(0, -b2);
        ctx.lineTo(-arm * 0.16, -b2 - arm * 0.12);
        ctx.moveTo(0, -b2);
        ctx.lineTo(arm * 0.16, -b2 - arm * 0.12);
        ctx.stroke();
        ctx.restore();
      }
      ctx.beginPath();
      ctx.arc(0, 0, Math.max(0.8, f.r * 0.1), 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawFlake(f) {
      if (f.kind === "crystal") drawCrystal(f);
      else drawDot(f);
    }

    function tick() {
      drawMedia();
      if (running) {
        const wind = Number(windInput.value);
        const speed = Number(speedInput.value);
        for (let i = 0; i < flakes.length; i++) {
          const f = flakes[i];
          f.wobble += f.wobbleSpeed;
          f.rot += f.spin;
          f.x += f.vx + wind * (0.25 + f.layer * 0.7) + Math.sin(f.wobble) * f.wobbleAmp;
          f.y += f.vy * speed;
          if (f.y - f.r > h + 10) flakes[i] = createFlake(true);
          else {
            if (f.x < -40) f.x = w + 40;
            if (f.x > w + 40) f.x = -40;
          }
        }
      }
      for (let pass = 0; pass < 3; pass++) {
        for (let i = 0; i < flakes.length; i++) {
          const f = flakes[i];
          const band = f.layer < 0.35 ? 0 : f.layer < 0.7 ? 1 : 2;
          if (band === pass) drawFlake(f);
        }
      }
      requestAnimationFrame(tick);
    }

    function syncOut() {
      document.getElementById("countOut").textContent = countInput.value;
      document.getElementById("speedOut").textContent = Number(speedInput.value).toFixed(1);
      document.getElementById("windOut").textContent = Number(windInput.value).toFixed(1);
      document.getElementById("sizeOut").textContent = Number(sizeInput.value).toFixed(1);
    }

    function clearUrl() {
      if (objectUrl) {
        URL.revokeObjectURL(objectUrl);
        objectUrl = null;
      }
    }

    function loadFile(file) {
      if (!file) return;
      clearUrl();
      mediaVideo.pause();
      objectUrl = URL.createObjectURL(file);
      if (file.type.startsWith("video/")) {
        mediaType = "video";
        mediaVideo.src = objectUrl;
        mediaVideo.play().catch(() => {});
      } else {
        mediaType = "image";
        mediaImg.src = objectUrl;
      }
      placeholder.hidden = true;
      statusEl.textContent = "已加载，调好雪后点「录制」";
      statusEl.classList.remove("rec");
    }

    function pickMime() {
      const list = [
        "video/mp4;codecs=avc1.42E01E",
        "video/mp4",
        "video/webm;codecs=vp9",
        "video/webm;codecs=vp8",
        "video/webm",
      ];
      if (!window.MediaRecorder) return null;
      for (const t of list) {
        if (MediaRecorder.isTypeSupported(t)) return t;
      }
      return "";
    }

    function stopRecord() {
      if (recordTimer) {
        clearTimeout(recordTimer);
        recordTimer = null;
      }
      if (recorder && recorder.state !== "inactive") {
        try { recorder.stop(); } catch (_) {}
      }
    }

    async function startRecord() {
      if (!mediaType) {
        statusEl.textContent = "请先上传一张照片或视频";
        return;
      }
      if (recording) {
        stopRecord();
        return;
      }
      const mime = pickMime();
      if (mime === null || typeof MediaRecorder === "undefined") {
        statusEl.textContent = "当前浏览器不支持网页录制，请点「全屏」后用系统录屏";
        statusEl.classList.add("rec");
        return;
      }

      chunks = [];
      let stream;
      try {
        stream = view.captureStream(30);
      } catch (e) {
        statusEl.textContent = "无法抓取画面，请用「全屏 + 系统录屏」";
        return;
      }

      try {
        recorder = mime ? new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 4500000 })
          : new MediaRecorder(stream, { videoBitsPerSecond: 4500000 });
      } catch (e) {
        try {
          recorder = new MediaRecorder(stream);
        } catch (e2) {
          statusEl.textContent = "录制初始化失败，请改用全屏系统录屏";
          return;
        }
      }

      recorder.ondataavailable = (e) => {
        if (e.data && e.data.size) chunks.push(e.data);
      };
      recorder.onstop = () => {
        recording = false;
        document.getElementById("recordBtn").textContent = "录制";
        document.getElementById("recordBtn").classList.remove("danger");
        stream.getTracks().forEach((t) => t.stop());
        if (!chunks.length) {
          statusEl.textContent = "没有录到内容，可试全屏系统录屏";
          statusEl.classList.remove("rec");
          return;
        }
        const type = recorder.mimeType || "video/webm";
        const blob = new Blob(chunks, { type });
        const ext = type.includes("mp4") ? "mp4" : "webm";
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `雪景_${Date.now()}.${ext}`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 4000);
        statusEl.textContent = "已导出，可到下载/文件里保存到相册";
        statusEl.classList.remove("rec");
      };

      recording = true;
      running = true;
      document.getElementById("pauseBtn").textContent = "暂停";
      document.getElementById("recordBtn").textContent = "停止";
      document.getElementById("recordBtn").classList.add("danger");
      statusEl.textContent = "录制中… 约 6 秒后自动保存";
      statusEl.classList.add("rec");
      recorder.start(200);
      recordTimer = setTimeout(() => stopRecord(), 6000);
    }

    let presenting = false;

    function setPresent(on) {
      presenting = !!on;
      document.body.classList.toggle("is-present", presenting);
      if (presenting) {
        statusEl.textContent = "全屏中：点一下画面即可退出";
      } else {
        statusEl.textContent = mediaType ? "已加载，调好雪后点「录制」" : "录制约 6 秒，完成后可保存到相册";
      }
      resize();
    }

    document.getElementById("pickBtn").onclick = () => fileInput.click();
    document.getElementById("uploadBtn").onclick = () => fileInput.click();
    fileInput.onchange = () => loadFile(fileInput.files?.[0]);

    document.getElementById("pauseBtn").onclick = () => {
      running = !running;
      document.getElementById("pauseBtn").textContent = running ? "暂停" : "继续";
    };
    document.getElementById("presentBtn").onclick = () => setPresent(true);
    stage.addEventListener("click", () => {
      if (presenting) setPresent(false);
    });
    document.getElementById("recordBtn").onclick = () => startRecord();
    document.getElementById("openHelp").onclick = () => helpSheet.classList.add("show");
    document.getElementById("closeHelp").onclick = () => {
      helpSheet.classList.remove("show");
      localStorage.setItem("xuejing_help_ok", "1");
    };

    ;[countInput, speedInput, windInput, sizeInput].forEach((el) => {
      el.addEventListener("input", () => {
        syncOut();
        if (el === countInput || el === sizeInput) rebuild();
      });
    });

    stage.addEventListener("dragover", (e) => e.preventDefault());
    stage.addEventListener("drop", (e) => {
      e.preventDefault();
      loadFile(e.dataTransfer?.files?.[0]);
    });

    window.addEventListener("resize", resize);
    window.addEventListener("orientationchange", () => setTimeout(resize, 250));

    if (!localStorage.getItem("xuejing_help_ok")) {
      helpSheet.classList.add("show");
    }

    syncOut();
    resize();
    tick();
  })();
  </script>
</body>
</html>
